version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: financial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial"]
      interval: 10s
      timeout: 5s
      retries: 5


  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    container_name: redpanda

    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false

      # Kafka listeners
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092

      # Advertised addresses
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092

      # Pandaproxy
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082

      # Schema Registry
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081

    ports:
      - "19092:19092"
      - "9644:9644"
      - "18082:18082"
      - "18081:18081"

    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 15s
      timeout: 5s
      retries: 5


  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    container_name: jaeger

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

    restart: unless-stopped


  console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: redpanda-console

    depends_on:
      redpanda:
        condition: service_healthy

    environment:
      KAFKA_BROKERS: redpanda:9092

    ports:
      - "8080:8080"


  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      postgres:
        condition: service_healthy

      redpanda:
        condition: service_healthy


  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile

    container_name: mcp-server

    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/financial
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081

      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000

      RUST_LOG: info

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redpanda:
        condition: service_healthy


volumes:
  postgres_data: