version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: financial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    container_name: redpanda

    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false

      # Broker interno (Docker)
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092

      # Broker anunciado para aplicaciones ejecutándose en el host
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092

      # API administrativa
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082

    ports:
      - "9092:9092"
      - "9644:9644"
      - "8082:8082"

    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 15s
      timeout: 5s
      retries: 5

  console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    container_name: redpanda-console

    depends_on:
      redpanda:
        condition: service_healthy

    environment:
      KAFKA_BROKERS: redpanda:9092

    ports:
      - "8080:8080"
  
  prometheus:

    image: prom/prometheus:latest

    container_name: prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      postgres:
        condition: service_healthy

      redpanda:
        condition: service_healthy

volumes:
  postgres_data: