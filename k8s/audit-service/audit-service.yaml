apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: financial-platform
  labels:
    app: audit-service
spec:
  type: ClusterIP
  selector:
    app: audit-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: financial-platform
  labels:
    app: audit-service
spec:
  replicas: 1

  selector:
    matchLabels:
      app: audit-service

  template:
    metadata:
      labels:
        app: audit-service

    spec:
      containers:
        - name: audit-service
          image: audit-service:local
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/financial"

            - name: KAFKA_BROKERS
              value: "redpanda:9092"

            - name: KAFKA_TOPIC
              value: "audit-events"

            - name: SCHEMA_REGISTRY_URL
              value: "http://redpanda:8081"

            - name: PORT
              value: "3000"

            - name: OTEL_SERVICE_NAME
              value: "audit-service"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"

            - name: RUST_LOG
              value: "info"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi