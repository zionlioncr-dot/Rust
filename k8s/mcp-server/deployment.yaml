apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: financial-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: mcp-server:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: OLLAMA_EMBEDDING_MODEL
              value: "nomic-embed-text"
            - name: KAFKA_BROKERS
              value: "redpanda:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://redpanda:8081"
            - name: MAX_DB_CONNECTIONS
              value: "5"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
              exec /usr/local/bin/mcp-server
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
