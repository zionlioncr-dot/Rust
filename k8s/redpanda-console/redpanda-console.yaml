apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-console-config
  namespace: financial-platform
data:
  config.yaml: |
    kafka:
      brokers:
        - redpanda:9092

    schemaRegistry:
      enabled: true
      urls:
        - http://redpanda:8081

    redpanda:
      adminApi:
        enabled: true
        urls:
          - http://redpanda:9644

    server:
      listenPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: financial-platform
  labels:
    app: redpanda-console
spec:
  replicas: 1

  selector:
    matchLabels:
      app: redpanda-console

  template:
    metadata:
      labels:
        app: redpanda-console

    spec:
      containers:
        - name: redpanda-console
          image: docker.redpanda.com/redpandadata/console:v3.12.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: CONFIG_FILEPATH
              value: /etc/console/config.yaml

          volumeMounts:
            - name: config
              mountPath: /etc/console
              readOnly: true

          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: config
          configMap:
            name: redpanda-console-config

---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: financial-platform
  labels:
    app: redpanda-console
spec:
  type: ClusterIP

  selector:
    app: redpanda-console

  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP