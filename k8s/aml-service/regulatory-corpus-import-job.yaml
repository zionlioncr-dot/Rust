apiVersion: batch/v1
kind: Job
metadata:
  name: regulatory-corpus-import-pymupdf
  namespace: financial-platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: regulatory-corpus-import-pymupdf
    spec:
      restartPolicy: Never
      containers:
        - name: regulatory-import
          image: aml-regulatory-import:local
          imagePullPolicy: Never
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: OLLAMA_EMBEDDING_MODEL
              value: "nomic-embed-text:latest"
            - name: REGULATORY_MANIFEST
              value: "/app/regulatory-corpus.jsonl"
            - name: REGULATORY_EXPECTED_COUNT
              value: "129"
            - name: MAX_DB_CONNECTIONS
              value: "3"
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
              exec /usr/local/bin/import_regulatory_corpus
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
